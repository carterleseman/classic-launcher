<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="ui.css" />
  
</head>
<body>
  <header>
    <div class="header-title">
      <img src="assets/wiz-16x16.png" width="16" height="16">
      Wizard101
    </div>
    <div class="header-controls">
      <button id="minimize"></button>
      <button id="close"></button>
    </div>
  </header>
  <main>
    <section>
      <div class="page-controls">
        <button></button>
        <h1 id="page-title"></h1>
        <button></button>
      </div>
      <div id="news" class="page" data-title="Ravenwood News"></div>
      <div id="accounts" class="page" data-title="Accounts" hidden>
        <div class="field-row-stacked">
          <label for="account-select">Selected Account</label>
          <select id="account-select"></select>
        </div>
        <div class="field-row-stacked">
          <label for="account-username">Username</label>
          <input type="text" id="account-username">
        </div>
        <div class="field-row-stacked">
          <label for="account-password">Password</label>
          <input type="password" id="account-password">
        </div>
        <div style="display: flex; gap: 10px">
          <button id="add-account">Add</button>
          <button id="remove-account" class="default">Remove</button>
          <button id="fill-login" class="default">Fill Login</button>
        </div>
        <p>*to update a password, enter the same username and new password and click add.</p>
      </div>
      <div id="settings" class="page" data-title="Settings" hidden>
        <p style="text-align: center">Click the save button at the bottom for any changes to take effect!</p>
        <div class="field-row-stacked">
          <label for="install-dir">
            Wizard101 Install Directory
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup left">
                <div class="tooltip-header">Install Location</div>
                <div class="tooltip-body">Where your game is installed. *only change if empty or you know what you're doing</div>
              </div>
            </div>
          </label>
          <input type="text" id="install-dir">
        </div>
        <div class="field-row">
          <input type="checkbox" id="fixed-window-size">
          <label for="fixed-window-size">
            Fixed Window Size
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup">
                <div class="tooltip-header">Fixed Window Size</div>
                <div class="tooltip-body">Locks the window to exactly 800x600 pixels regardless of display scaling. Disable if the window appears too small on a high-DPI display. *requires restart of launcher</div>
              </div>
            </div>
          </label>
        </div>
        <div class="field-row">
          <input type="checkbox" id="remember-password">
          <label for="remember-password">
            Remember Password
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup">
                <div class="tooltip-header">Remember Password</div>
                <div class="tooltip-body">Saves your password encrypted using your Windows account. It can only be decrypted on this machine by you.</div>
              </div>
            </div>
          </label>
        </div>
        <div class="field-row">
          <input type="checkbox" id="quick-launch">
          <label for="quick-launch">
            Quick Launch
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup">
                <div class="tooltip-header">Quick Launch</div>
                <div class="tooltip-body">Skips patching the game and launches immediately. *will not work after a game update</div>
              </div>
            </div>
          </label>
        </div>
        <div class="field-row">
          <input type="checkbox" id="use-orig-auth">
          <label for="use-orig-auth">
            Use Original Authentication
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup top left">
                <div class="tooltip-header">Use Original Authentication</div>
                <div class="tooltip-body">Uses the game's graphical login instead of the authentication shipped with this launcher. Credentials are typed into the login UI automatically. *for the paranoid</div>
              </div>
            </div>
          </label>
        </div>
        <div class="field-row">
          <input type="checkbox" id="keep-open">
          <label for="keep-open">
            Keep Launcher Open
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup top left">
                <div class="tooltip-header">Keep Launcher Open</div>
                <div class="tooltip-body">Keeps the launcher open after launching the game and resets it to the login state. *helpful when using multiple accounts</div>
              </div>
            </div>
          </label>
        </div>
        <div class="field-row">
          <input type="checkbox" id="enable-accounts">
          <label for="enable-accounts">
            Enable Account Selection
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup top left">
                <div class="tooltip-header">Enable Account Selection</div>
                <div class="tooltip-body">Adds an accounts page where you can save multiple logins and switch between them.</div>
              </div>
            </div>
          </label>
        </div>
        <div class="field-row-stacked">
          <label for="game-resolution">
            Resolution
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup top">
                <div class="tooltip-header">Resolution</div>
                <div class="tooltip-body">Sets the resolution the game launches at.</div>
              </div>
            </div>
          </label>
          <select id="game-resolution"></select>
        </div>
        <div class="field-row-stacked">
          <label for="starting-page">
            Start Page
            <div class="tooltip-wrap">
              <img src="assets/help.png" width="10" height="10">
              <div class="tooltip-popup top">
                <div class="tooltip-header">Start Page</div>
                <div class="tooltip-body">Changes what page the launcher opens to.</div>
              </div>
            </div>
          </label>
          <select id="starting-page">
            <option selected>Ravenwood News</option>
            <option>Settings</option>
            <option id="starting-page-accounts" hidden>Accounts</option>
          </select>
        </div>
        <button id="save-settings">Save</button>
      </div>
      <div class="section-footer">
        <a href="https://www.wizard101.com/CustomerSupport/game">
          <span style="padding-left: 15px">CONTACT <br>SUPPORT</span>
          <img src="assets/support.png" width="48" height="54" style="right: 80px">
        </a>
        <a href="https://forms.gle/todApLn9NYf4vtju7">
          <span style="padding-right: 15px">REPORT <br>A BUG</span>
          <img src="assets/bug.png" width="48" height="48" style="left: 75px">
        </a>
      </div>
    </section>
    <a href="https://www.wizard101.com/game">
      <img src="assets/w101-logo.webp" width="312" height="180">
    </a>
    <aside><b>NEVER</b> share your password - you will lose your Wizard forever!</aside>
  </main>
  <footer>
    <button style="margin-right: 6px" onclick="__renderPage('Settings')">Settings</button>
    <div id="login-fields" class="footer-fields">
      <div class="field-row-stacked" style="margin-right: 12px">
        <label for="username">Username</label>
        <input type="text" id="username">
      </div>
      <div class="field-row-stacked" style="margin-right: 14px">
        <label for="password">Password</label>
        <input type="password" id="password">
      </div>
      <div class="field-row" style="margin-bottom: 8px">
        <input type="checkbox" id="remember-username">
        <label for="remember-username">Remember Username</label>
      </div>
      <button style="margin-left: 42px" id="login">Login</button>
    </div>
    <div id="play-fields" class="footer-fields">
      <div class="field-row-stacked">
        <label>File Progress<span id="file-name"></span></label>
        <progress id="file-progress" value="0" max="100"></progress>
      </div>
      <div class="field-row-stacked">
        <label>Total Progress</label>
        <progress id="total-progress" value="0" max="100"></progress>
      </div>
      <button style="margin-left: 8px" id="play" disabled>PLAY!</button>
    </div>
  </footer>
<script>
  let enableAccounts = false;
  let pages = [];
  const pageControls = document.querySelector('.page-controls');
  let currentPageIndex = 0;

  function rebuildPages() {
    const currentTitle = pages[currentPageIndex]?.dataset.title;
    const allPages = Array.from(document.querySelectorAll('.page'));
    pages = enableAccounts
      ? allPages
      : allPages.filter((page) => page.id !== 'accounts');
    if (currentTitle) {
      const idx = pages.findIndex((page) => page.dataset.title === currentTitle);
      if (idx !== -1) {
        currentPageIndex = idx;
      } else {
        const newsIdx = pages.findIndex((page) => page.id === 'news');
        currentPageIndex = newsIdx === -1 ? 0 : newsIdx;
      }
    }
    __showPageAtIndex(currentPageIndex);
  }

  function __showPageAtIndex(index) {
    if (pages.length === 0) return;
    currentPageIndex = ((index % pages.length) + pages.length) % pages.length;
    pages.forEach((page, i) => {
      const selected = i === currentPageIndex;
      page.setAttribute('aria-selected', selected ? 'true' : 'false');
      page.hidden = !selected;
    });
    document.getElementById('page-title').textContent = pages[currentPageIndex].dataset.title;
  }

  function __renderPage(title) {
    const index = pages.findIndex((page) => page.dataset.title === title);
    if (index === -1) return;
    __showPageAtIndex(index);
  }

  function __stepPage(delta) {
    __showPageAtIndex(currentPageIndex + delta);
  }

  pageControls.firstElementChild.addEventListener('click', () => __stepPage(-1));
  pageControls.lastElementChild.addEventListener('click', () => __stepPage(1));

  rebuildPages();

  function __renderNews(items) {
    const base      = 'https://www.wizard101.com';
    const abs       = (url) => url && url.startsWith('/') ? base + url : url;
    const fixLinks  = (html) => html.replace(/href="(\/[^"]*)"/g, (_, p) => `href="${abs(p)}"`);

    const news = document.getElementById('news');

    for (const item of items) {
      const article = document.createElement('article');

      const figure = document.createElement('figure');
      const img    = document.createElement('img');
      img.src = item.img_src;
      if (item.img_w) img.width  = item.img_w - 35;
      if (item.img_h) img.height = item.img_h - 35;

      if (item.img_href) {
        const a = document.createElement('a');
        a.href = item.img_href;
        a.appendChild(img);
        figure.appendChild(a);
      } else {
        figure.appendChild(img);
      }

      const p = document.createElement('p');
      p.innerHTML = fixLinks(item.body);

      article.appendChild(figure);
      article.appendChild(p);
      news.appendChild(article);
    }
  }

  // ── C++ → JS (called via ExecuteScript) ──────────────────────────────────

  function __showPatchProgress() {
    document.getElementById('login-fields').style.display = 'none';
    document.getElementById('play-fields').style.display  = 'flex';
  }

  function __setFileProgress(name, percent) {
    const short = name.split('/').pop();
    document.getElementById('file-name').textContent = short;
    document.getElementById('file-progress').value   = percent;
  }

  function __setOverallProgress(percent) {
    document.getElementById('total-progress').value = percent;
    if (percent >= 100) {
      document.getElementById('file-progress').value = 100;
      document.getElementById('file-name').textContent = 'Download Complete!';
      const btn = document.getElementById('play');
      btn.disabled = false;
      btn.removeAttribute('disabled');
    }
  }

  function __showLoginError() {
    const btn = document.getElementById('login');
    btn.disabled    = false;
    btn.textContent = 'Login';
  }

  function __resetToLogin() {
    document.getElementById('play-fields').style.display  = 'none';
    document.getElementById('login-fields').style.display = 'flex';
    document.getElementById('file-progress').value  = 0;
    document.getElementById('total-progress').value = 0;
    document.getElementById('file-name').textContent = '';
    const play = document.getElementById('play');
    play.disabled = true;
    play.setAttribute('disabled', '');
    const login = document.getElementById('login');
    login.disabled    = false;
    login.textContent = 'Login';
    document.getElementById('password').value = '';
  }

  // ── JS → C++ (postMessage bridge) ────────────────────────────────────────

  document.getElementById('login').addEventListener('click', () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) return;

    const remember = document.getElementById('remember-username').checked;
    window.chrome.webview.postMessage(
      JSON.stringify({ action: 'login', username, password, remember })
    );
  });

  function __setRememberedUsername(name) {
    if (!name) return;
    document.getElementById('username').value = name;
    document.getElementById('remember-username').checked = true;
  }

  function __setRememberedPassword(password) {
    if (!password) return;
    document.getElementById('password').value = password;
  }

  function __fillLoginFields(username, password) {
    document.getElementById('username').value = username || '';
    document.getElementById('password').value = password || '';
  }

  function __initAccounts(selectedUsername, usernames) {
    const select = document.getElementById('account-select');
    select.replaceChildren();
    for (const name of usernames) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    }
    if (select.options.length === 0) {
      select.selectedIndex = -1;
      return;
    }
    if (selectedUsername) {
      for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].value === selectedUsername) {
          select.selectedIndex = i;
          return;
        }
      }
    }
    // Single option or no saved selection: select the first entry.
    select.selectedIndex = 0;
  }

  function resolutionLabel(value) {
    if (value === 'off')        return 'Off';
    if (value === 'borderless') return 'Borderless Fullscreen';
    if (value === 'fullscreen') return 'Fullscreen';
    return value;
  }

  function populateResolutionSelect(options, selected) {
    const select = document.getElementById('game-resolution');
    select.replaceChildren();
    for (const value of options) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = resolutionLabel(value);
      select.appendChild(option);
    }
    for (let i = 0; i < select.options.length; i++) {
      if (select.options[i].value === selected) {
        select.selectedIndex = i;
        return;
      }
    }
    select.selectedIndex = 0;
  }

  function __initResolutionSettings(options, selected) {
    populateResolutionSelect(options, selected);
  }

  // Called once on load by the C++ backend to populate settings fields and
  // navigate to the user's chosen starting page.
  function __initSettings(installDir, fixedWindowSize, quickLaunch, useOrigAuth, keepOpen, rememberPassword, enableAccountsSetting, startingPage) {
    document.getElementById('install-dir').value = installDir;
    document.getElementById('fixed-window-size').checked = fixedWindowSize;
    document.getElementById('quick-launch').checked = quickLaunch;
    document.getElementById('use-orig-auth').checked = useOrigAuth;
    document.getElementById('keep-open').checked = keepOpen;
    document.getElementById('remember-password').checked = rememberPassword;
    document.getElementById('enable-accounts').checked = enableAccountsSetting;
    enableAccounts = enableAccountsSetting;

    const accountsOption = document.getElementById('starting-page-accounts');
    accountsOption.hidden = !enableAccounts;

    const select = document.getElementById('starting-page');
    for (let i = 0; i < select.options.length; i++) {
      if (select.options[i].value === startingPage) {
        select.selectedIndex = i;
        break;
      }
    }

    rebuildPages();

    if (startingPage && (startingPage !== 'Accounts' || enableAccounts))
      __renderPage(startingPage);
  }

  document.getElementById('save-settings').addEventListener('click', () => {
    const installDir       = document.getElementById('install-dir').value;
    const fixedWindowSize  = document.getElementById('fixed-window-size').checked;
    const quickLaunch      = document.getElementById('quick-launch').checked;
    const useOrigAuth      = document.getElementById('use-orig-auth').checked;
    const keepOpen         = document.getElementById('keep-open').checked;
    const rememberPassword = document.getElementById('remember-password').checked;
    const enableAccountsSetting = document.getElementById('enable-accounts').checked;
    let startingPage     = document.getElementById('starting-page').value;
    const gameResolution = document.getElementById('game-resolution').value;
    enableAccounts = enableAccountsSetting;
    document.getElementById('starting-page-accounts').hidden = !enableAccounts;
    if (!enableAccountsSetting && startingPage === 'Accounts') {
      document.getElementById('starting-page').selectedIndex = 0;
      startingPage = document.getElementById('starting-page').value;
    }
    rebuildPages();
    window.chrome.webview.postMessage(
      JSON.stringify({ action: 'save_settings', install_dir: installDir,
                       fixed_window_size: fixedWindowSize,
                       quick_launch: quickLaunch,
                       use_orig_auth: useOrigAuth,
                       keep_open: keepOpen,
                       remember_password: rememberPassword,
                       enable_accounts: enableAccountsSetting,
                       starting_page: startingPage,
                       game_resolution: gameResolution })
    );
  });

  function postSelectAccount() {
    const username = document.getElementById('account-select').value;
    if (!username) return;
    window.chrome.webview.postMessage(
      JSON.stringify({ action: 'select_account', username })
    );
  }

  document.getElementById('account-select').addEventListener('change', postSelectAccount);

  document.getElementById('fill-login').addEventListener('click', postSelectAccount);

  document.getElementById('add-account').addEventListener('click', () => {
    const username = document.getElementById('account-username').value.trim();
    const password = document.getElementById('account-password').value;
    if (!username || !password) return;
    window.chrome.webview.postMessage(
      JSON.stringify({ action: 'add_account', username, password })
    );
    document.getElementById('account-username').value = '';
    document.getElementById('account-password').value = '';
  });

  document.getElementById('remove-account').addEventListener('click', () => {
    const username = document.getElementById('account-select').value;
    if (!username) return;
    window.chrome.webview.postMessage(
      JSON.stringify({ action: 'remove_account', username })
    );
  });

  (function () {
    const n = Math.floor(Math.random() * 15) + 1;
    const style = document.createElement('style');
    style.textContent = `main::before { background-image: url('assets/backgrounds/${n}.webp'); }`;
    document.head.appendChild(style);
  })();

  document.getElementById('play').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ action: 'play' }));
  });

  document.querySelector('.header-title').addEventListener('mousedown', (e) => {
    if (e.button === 0)
      window.chrome.webview.postMessage(JSON.stringify({ action: 'drag' }));
  });

  document.getElementById('minimize').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ action: 'minimize' }));
  });

  document.getElementById('close').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ action: 'close' }));
  });
</script>
</body>
</html>
